spring.application.name=customer-service

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Register localhost instead of machine hostname
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost

#  PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_db
spring.datasource.username=postgres
spring.datasource.password=P@ssw0rd
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=customer_schema

#  flyway
spring.flyway.enabled=true
spring.flyway.default-schema=customer_schema
spring.flyway.schemas=customer_schema

# Actuator
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=always

# pagination
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
