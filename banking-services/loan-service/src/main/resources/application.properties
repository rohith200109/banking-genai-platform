spring.application.name=loan-service

server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Register localhost instead of machine hostname
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/banking_db
spring.datasource.username=postgres
spring.datasource.password=P@ssw0rd
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=loan_schema

# Flyway
spring.flyway.enabled=true
spring.flyway.default-schema=loan_schema
spring.flyway.schemas=loan_schema

# Kafka
# Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=loan-service-group

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.bank.ai.loanservice.event.AccountCreatedEvent

spring.kafka.consumer.properties.spring.json.trusted.packages=com.bank.ai.loanservice.event

# Actuator
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=always